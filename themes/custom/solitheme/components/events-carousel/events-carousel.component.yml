name: Events Carousel
description: 3D auto-scrolling carousel for festival/event cards.
status: experimental

props:
  type: object
  properties:
    heading:
      type: string
      title: Section heading
      default: "EVENTS"
    eyebrow:
      type: string
      title: Eyebrow label above heading
      default: "Timeline"
    events:
      type: array
      title: Event items
      items:
        type: object
        properties:
          name:
            type: string
          category:
            type: string
          image_url:
            type: string
          attendees:
            type: string
          is_hot:
            type: boolean
          description:
            type: string

libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
